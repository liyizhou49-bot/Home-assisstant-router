<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>语音与文字对话</title><style>
:root{font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif;color:#243139;background:#f4f6f8;color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:850px;margin:auto}h1{font-size:24px;margin:0 0 4px}.muted{color:#647580;font-size:13px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.chat{height:290px;overflow:auto;border:1px solid #d8e0e6;border-radius:14px;background:#fff;padding:16px;margin:18px 0}.empty{color:#7b8992;text-align:center;padding:75px 10px}.message{white-space:pre-wrap;overflow-wrap:anywhere;padding:10px 14px;border-radius:12px;margin:0 0 12px;max-width:92%;background:#edf2f5}.user{margin-left:auto;background:#d9edf6}.label{display:block;font-size:12px;color:#627987;margin-bottom:3px}.metrics{display:flex;gap:16px;flex-wrap:wrap;padding:10px 0;color:#526874;font-size:13px}textarea{font:inherit;width:100%;padding:12px;border:1px solid #bdcbd5;border-radius:12px;background:#fff;color:inherit;resize:vertical}button{font:inherit;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;background:#087ea4;color:#fff}button.secondary{background:#e4ebf0;color:#344e5d}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:10px;align-items:center;margin:10px 0}.status{font-size:13px;color:#526874;flex:1}audio{width:100%;height:38px;margin:4px 0 8px}.error{color:#b52c37}@media(prefers-color-scheme:dark){:root{background:#192126;color:#e4ebef}.chat,textarea{background:#222d34;border-color:#41515c}.message{background:#303f49}.user{background:#1b5064}.muted,.metrics,.status,.label{color:#a5b9c5}button.secondary{background:#384955;color:#e4ebef}}@media(max-width:500px){body{padding:12px}.chat{height:260px}.metrics{gap:8px;font-size:12px}}
</style></head><body><main>
<div class="top"><div><h1>语音与文字对话</h1><div class="muted">使用当前助手的朗读引擎；可选择极速或自然播放。</div></div><button class="secondary" id="new">新对话</button></div>
<iframe src="stt_modes.html?v=082" title="语音识别：正常或极速" style="border:0;width:100%;height:162px;margin-top:12px"></iframe>
<div class="muted" id="recognition-status" role="status" aria-live="polite">最近语音识别：等待测试。</div>
<div class="actions"><label for="mode">播放方式</label><select id="mode" style="font:inherit;padding:7px;border-radius:8px"><option value="fast">极速</option><option value="natural">自然 · 整段</option></select><span class="muted" id="mode-help">整段：等完整音频后播放，等待较长。</span></div>
<div class="chat" id="chat" aria-live="polite"><div class="empty" id="empty">试试“我回来啦”，或输入一段想问的话。</div></div>
<audio id="audio" controls preload="none"></audio>
<div class="metrics"><span>首段文字 <b id="first">—</b></span><span>开始朗读 <b id="speak">—</b></span><span>文字完成 <b id="end">—</b></span></div>
<form id="form"><textarea id="input" rows="3" aria-label="输入请求" placeholder="输入一句话；Ctrl + Enter 发送"></textarea><div class="actions"><button id="send" type="submit">发送并朗读</button><button type="button" class="secondary" id="stop">停止朗读</button><span class="status" id="status">正在连接 HA…</span></div></form>
<div class="muted">新对话不会删除长期习惯。浏览器若阻止自动播放，请点上方播放器的播放按钮。语音输入请点击页面上方的“开始语音对话”，识别后自动交给当前路由。</div>
</main><script>
const $=id=>document.getElementById(id);let hass,pipeline,conversationId=null,busy=false,started=0,firstText=false,firstAudio=false,runNumber=0,audioFetch=null,objectUrl=null;
const audio=$('audio');const seconds=()=>((performance.now()-started)/1000).toFixed(2)+' 秒';
let stopTrace=null;
function recognitionStatus(attributes={}){const rec=attributes.recognition||{};
 if(rec.source==='text'){$('recognition-status').textContent='本次为文字输入，没有语音识别耗时。';return}
 if(rec.source!=='voice'){$('recognition-status').textContent='最近语音识别：尚未记录，请点击上方麦克风说一句。';return}
 const wait=typeof rec.recognition_ms==='number'?(rec.recognition_ms/1000).toFixed(2)+' 秒（检测说完后）':'结束时间未上报，无法精确计算';
 $('recognition-status').textContent='最近语音 · '+(rec.mode||rec.engine_name||'当前识别引擎')+' · 识别 '+wait+(typeof attributes.elapsed_ms==='number'?' · 文字处理 '+attributes.elapsed_ms.toFixed(1)+' 毫秒':'');
}
window.addEventListener?.('pagehide',()=>stopTrace?.());
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
function message(label,text,kind){$('empty')?.remove();const node=document.createElement('div');node.className='message '+kind;const heading=document.createElement('span');heading.className='label';heading.textContent=label;const body=document.createElement('div');body.textContent=text;node.append(heading,body);$('chat').append(node);$('chat').scrollTop=$('chat').scrollHeight;return body}
function setBusy(value){busy=value;$('send').disabled=value;$('new').disabled=value;$('mode').disabled=value}
function stop(){audioFetch?.abort();audioFetch=null;audio.pause();audio.removeAttribute('src');audio.load();if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}}
function modeHelp(){$('mode-help').textContent=$('mode').value==='natural'?'整段：等完整音频后播放，等待较长。':'极速：收到音频就播放，开口更早。'}
async function modeCall(mode){const r=await hass.callWS({type:'call_service',domain:'router_lab',service:'speech_mode',service_data:mode?{mode}:{},return_response:true});return r.response.mode}
$('mode').onchange=async()=>{modeHelp();$('mode').disabled=true;try{await modeCall($('mode').value);status('模式已保存，从下一条回复生效。')}catch(e){status('当前页面已切换；未能保存为默认模式，需管理员权限。',true)}finally{$('mode').disabled=busy}};
$('stop').onclick=()=>{audio.pause();status('朗读已暂停，可在播放器继续。')};
audio.onplaying=()=>{if(!firstAudio&&started){firstAudio=true;$('speak').textContent=seconds()}};
$('new').onclick=()=>{conversationId=null;runNumber++;stop();$('chat').replaceChildren();message('助手','已开始新对话，长期习惯仍然保留。','assistant');status('可以输入下一句话。')};
$('input').onkeydown=e=>{if(e.ctrlKey&&e.key==='Enter'&&!e.isComposing){e.preventDefault();$('form').requestSubmit()}};
async function connect(){
 try{hass=window.parent.document.querySelector('home-assistant')?.hass;
  if(!hass)throw Error('请从HA的路由测试台打开这个页面。');
  const list=await hass.callWS({type:'assist_pipeline/pipeline/list'});pipeline=list.pipelines.find(p=>p.conversation_engine==='conversation.router_lab');
  recognitionStatus(hass.states?.['sensor.router_lab_trace']?.attributes);
  if(hass.connection.subscribeEvents)stopTrace=await hass.connection.subscribeEvents(event=>{if(event.data?.entity_id==='sensor.router_lab_trace')recognitionStatus(event.data.new_state?.attributes)},'state_changed');
  try{$('mode').value=await modeCall();modeHelp()}catch(e){modeHelp()}
  if(!pipeline?.tts_engine)throw Error('此助手尚未配置朗读引擎。');status('已连接 · '+(hass.states?.[pipeline.tts_engine]?.attributes?.friendly_name||(pipeline.tts_engine==='tts.piper'?'Piper 本地中文':'当前朗读引擎')));
 }catch(e){status(e.message||'连接失败，请刷新页面。',true);$('send').disabled=true}
}
$('form').onsubmit=async e=>{
 e.preventDefault();const text=$('input').value.trim();if(!text||busy||!pipeline)return;
 stop();const thisRun=++runNumber;const natural=$('mode').value==='natural';let naturalReady=false;setBusy(true);$('input').value='';message('你',text,'user');const answer=message('助手','正在处理…','assistant');let reply='',role='assistant';
 started=performance.now();firstText=false;firstAudio=false;for(const id of ['first','speak','end'])$(id).textContent='—';status('正在处理…');
 let unsubPromise;const finish=()=>{setBusy(false);unsubPromise?.then(unsub=>unsub()).catch(()=>{})};
 try{unsubPromise=hass.connection.subscribeMessage(event=>{
  const data=event.data||{};
  if(event.type==='run-start'){
   conversationId=data.conversation_id;if(data.tts_output?.url){
    if(natural){const controller=new AbortController();audioFetch=controller;status('整段播放：正在准备完整语音，文字会继续显示…');
     fetch(data.tts_output.url,{signal:controller.signal,credentials:'same-origin'}).then(r=>{if(!r.ok)throw Error('audio');return r.blob()}).then(blob=>{
      if(thisRun!==runNumber)return;audioFetch=null;naturalReady=true;objectUrl=URL.createObjectURL(blob);audio.src=objectUrl;status('完整语音已就绪，正在朗读。');audio.play().catch(()=>status('语音已就绪，请点播放器的播放按钮。'))
     }).catch(e=>{if(e.name!=='AbortError'&&thisRun===runNumber)status('完整语音下载未完成，请重试。',true)})
    }else{audio.src=data.tts_output.url;audio.play().catch(()=>status('浏览器未允许自动播放，请点播放器的播放按钮。'))}
   }
  }else if(event.type==='intent-progress'){
   const delta=data.chat_log_delta||{};if(delta.role)role=delta.role;
   if(role==='assistant'&&typeof delta.content==='string'&&delta.content){if(!firstText){firstText=true;$('first').textContent=seconds()}reply+=delta.content;answer.textContent=reply;$('chat').scrollTop=$('chat').scrollHeight}
   if(data.tts_start_streaming)status(natural?'正在生成完整语音，暂不播放片段…':'正在逐句朗读，后续文字继续生成…');
  }else if(event.type==='intent-end'){
   const final=data.intent_output?.response?.speech?.plain?.speech;if(typeof final==='string')answer.textContent=final;
   $('end').textContent=seconds();if(!firstText&&final)$('first').textContent=seconds();
  }else if(event.type==='run-end'){status(natural&&!naturalReady?'文字已完成，等待完整语音就绪…':'回复已生成，朗读由播放器继续。');finish()}
  else if(event.type==='error'){answer.textContent='本次没有完成，请稍后重试。';status(data.message||data.code||'处理失败',true);finish()}
 },{type:'assist_pipeline/run',pipeline:pipeline.id,start_stage:'intent',end_stage:'tts',input:{text},...(conversationId?{conversation_id:conversationId}:{})});
 await unsubPromise;
 }catch(e){answer.textContent='连接中断，请刷新后重试。';status('请求没有完成。',true);setBusy(false)}
};connect();
</script></body></html>
