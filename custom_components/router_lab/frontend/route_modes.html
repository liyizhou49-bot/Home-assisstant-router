<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>句式学习</title><style>
:root{font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif;color:#273b45;background:#fff;color-scheme:light dark}body{margin:0;padding:20px}h1{font-size:23px;margin:0}h2{font-size:19px;margin:22px 0 8px}p,small{color:#677b86;font-size:13px}small{display:block;white-space:pre-wrap}button{font:inherit;border:0;border-radius:9px;background:#e4eff3;color:#146175;padding:8px 14px;cursor:pointer}button:disabled{opacity:.5}.row{border-top:1px solid #dce5e9;padding:15px 0}.row strong{display:block}.sentence{white-space:pre-wrap;margin:7px 0}.badge{display:inline-block;font-size:12px;border-radius:20px;background:#e9f4f0;color:#216451;padding:3px 10px;margin:5px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}.error{color:#b1263b}#status{min-height:24px}@media(prefers-color-scheme:dark){:root{background:#23333b;color:#e0e9ed}p,small{color:#adc0ca}.row{border-color:#425e69}button{background:#344e5a;color:#dfedf2}}
</style><h1>扩展句式与学习过程</h1><p>路由模式、空闲秒数和每日次数已集中到“基本设置”。这里只展示当前账号的扩展指令和分析记录。</p><div class="actions"><button id="refresh">刷新记录</button><button id="retry">重新排队未学会的案例</button></div><p id="summary"></p><p id="status" role="status">正在连接 HA…</p><h2>已扩展的本地句式</h2><div id="rules"></div><h2>学习过程</h2><p>包含原话、本地未识别原因和研究结果。复合、主观或没有明确执行证据的表达不会直接固化成动作。</p><div id="cases"></div>
<script>
const $=id=>document.getElementById(id);let hass,busy=false,alive=true,unsub;
const labels={pending:'待空闲分析',researching:'正在分析',learned:'已补充本地句式',review:'需要进一步验证',skipped:'未固化',failed:'分析未完成'};
function node(tag,text,parent){const n=document.createElement(tag);n.textContent=text;parent.append(n);return n}
function render(data){const usage=data.usage||{};$('summary').textContent='后台：'+data.status+' · 今日研究 '+(usage.research_calls||0)+'/'+data.daily_limit+' 次 · 已返回用量 '+(usage.research_tokens||0)+' token';$('rules').replaceChildren();if(!data.rules?.length)node('p','还没有新增句式。遇到本地识别失败并转给大模型的明确指令后，会在空闲时研究。',$('rules'));for(const rule of data.rules||[]){const row=node('div','',$('rules'));row.className='row';node('strong',rule.enabled===false?'已停用':rule.available===false?'设备能力已变化，暂不匹配':'已启用',row);node('div',rule.sentences.join('\n'),row).className='sentence';node('small',rule.reason||'',row);const button=node('button',rule.enabled?'停用':'启用',row);button.onclick=()=>operate({operation:rule.enabled?'disable':'enable',rule_id:rule.id})}$('cases').replaceChildren();if(!data.cases?.length)node('p','暂时没有待研究的本地回退案例。',$('cases'));for(const item of (data.cases||[]).slice(0,30)){const row=node('div','',$('cases'));row.className='row';node('strong',item.text,row);node('span',labels[item.status]||item.status,row).className='badge';node('small',item.reason||'',row);node('small',new Date(item.created_at).toLocaleString('zh-CN'),row)}}
async function operate(data={}){if(!hass||busy)return;busy=true;for(const b of document.querySelectorAll('button'))b.disabled=true;try{const r=await hass.callWS({type:'call_service',domain:'router_lab',service:'route_mode',service_data:data,return_response:true});render(r.response);$('status').textContent=Object.keys(data).length?'已更新。':'已读取学习记录。';$('status').classList.remove('error')}catch(e){$('status').textContent=e.message||'读取失败，请刷新重试。';$('status').classList.add('error')}finally{busy=false;for(const b of document.querySelectorAll('button'))b.disabled=false}}
$('refresh').onclick=()=>operate();$('retry').onclick=()=>operate({operation:'retry'});window.addEventListener('pagehide',()=>{alive=false;unsub?.()});
(async()=>{let view=window.parent;for(let i=0;i<5&&view;i++){hass=view.document.querySelector('home-assistant')?.hass;if(hass||view===view.parent)break;view=view.parent}if(!hass){$('status').textContent='请从 HA 设置页打开。';return}await operate();try{unsub=await hass.connection.subscribeEvents(e=>{if(e.data.entity_id==='sensor.router_lab_learning'&&!document.hidden)operate()},'state_changed');if(!alive)unsub()}catch(e){}})();
</script></html>
